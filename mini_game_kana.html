<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Mini Game Kana</title>
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon"
    href="https://raw.githubusercontent.com/leewonkya/JP-LEARNING/main/icons/favicon.png">
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180"
    href="https://raw.githubusercontent.com/leewonkya/JP-LEARNING/main/icons/apple-touch-icon-180x180.png">

  <!-- Android Chrome Icons (Manifest) -->
  <link rel="manifest" href="https://raw.githubusercontent.com/leewonkya/JP-LEARNING/main/manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KanaGame">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="game-box">
    <h2>Mini Game Kana</h2>

    <div class="controls">
      <div class="controls-top">
        <div class="control-row">
          <label>Bảng chữ:
            <select id="mode" class="form-control">
              <option value="hiragana">Hiragana</option>
              <option value="katakana">Katakana</option>
            </select>
          </label>
          <span>|</span>
        </div>
        <div class="control-row">
          <label>Mode:
            <select id="questionMode" class="form-control">
              <option value="toRoma">Chọn Romaji từ Ký tự</option>
              <option value="toKana">Chọn Ký tự từ Romaji</option>
            </select>
          </label>

          <span>|</span>

        </div>
        <div class="control-row">
          <div class="switch-container">
            <span class="switch-label">
              Hide/Show
            </span>
            <label class="switch">
              <input type="checkbox" class="switch-show-hide" value="#" name="#" checked=""
                onchange="toggleShowHideAns(this)">

              <span class="slider"></span></label>

          </div>
          <span>|</span>
        </div>
        <div class="control-row">
          <div class="switch-container">
            <button id="toggleAudioBtn">🔊</button>
          </div>
        </div>
      </div>

      <div id="groupSwitches">
      </div>

      <div class="time-start-controls">
        <label>Thời gian suy nghĩ mỗi câu (giây): <input type="number" id="thinkTime" value="5" min="1"
            class="form-control"></label>
        <button onclick="startGame()">Bắt đầu</button>
        <button onclick="resetGame()">Đặt lại</button>
      </div>
    </div>

    <div class="kana" id="kana">?</div>

    <p id="status">Nhấn Bắt đầu cho câu tiếp theo.</p>

    <div class="answers" id="answersBox">
      <button onclick="chooseAnswer(0)" id="btn0"></button>
      <button onclick="chooseAnswer(1)" id="btn1"></button>
      <button onclick="chooseAnswer(2)" id="btn2"></button>
      <button onclick="chooseAnswer(3)" id="btn3"></button>
    </div>

    <div id="stats">
      ✅ Đúng: <span id="correct">0</span> | ❌ Sai: <span id="wrong">0</span> | 📊 Tổng: <span id="total">0</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
